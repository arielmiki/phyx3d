name: Release

# Publish to npm when a version tag is pushed:
#   npm version patch   # or minor / major — bumps package.json and creates the tag
#   git push --follow-tags
# Uses npm Trusted Publishing (OIDC) — no token. One-time setup on npmjs.com:
#   package phyx3d → Settings → Trusted Publisher → GitHub Actions:
#   owner arielmiki, repository phyx3d, workflow release.yml

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted-publishing support (≥ 11.5.1)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require(`./package.json`).version')" = "${GITHUB_REF_NAME}"
      - name: Publish to npm (skipped if this version is already published)
        run: |
          if npm view "phyx3d@$(node -p 'require(`./package.json`).version')" version >/dev/null 2>&1; then
            echo "Version already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ github.token }}
